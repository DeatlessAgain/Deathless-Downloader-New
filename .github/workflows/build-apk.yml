name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Generate Production APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Fix Executable Permissions
        run: chmod +x gradlew

      - name: Compile Kotlin and Assemble APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Export Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deathless-Downloader-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
        with:
          name: Deathless-Downloader-Debug-APK
          path: output/Deathless-Downloader-debug.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.release_tag || 'v1.0.0' }}
          name: Deathless Downloader APK (${{ github.ref_name || github.event.inputs.release_tag || 'v1.0.0' }})
          body: |
            ## 🚀 Deathless Downloader Android APK
            - **Build Type**: Android Debug APK
            - **Commit**: `${{ github.sha }}`
            - **Platform**: Capacitor 8 / Android SDK 36
            
            ### 📲 How to Install:
            1. Download the `Deathless-Downloader-debug.apk` file attached below.
            2. On your Android phone, tap the file to install.
            3. If prompted, enable "Allow installation from unknown sources".
          draft: false
          prerelease: false
          files: |
            output/Deathless-Downloader-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
