name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish APK directly as a GitHub Release'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Custom tag name for Release (e.g. v1.0.0)'
        required: false
        type: string
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          npm install

      - name: Build Web Application
        run: |
          npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/Deathless-Downloader-debug.apk
          echo "APK successfully built:"
          ls -lh output/Deathless-Downloader-debug.apk

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Deathless-Downloader-Debug-APK
          path: output/Deathless-Downloader-debug.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.release_tag || 'v1.0.0' }}
          name: Deathless Downloader APK (${{ github.ref_name || github.event.inputs.release_tag || 'v1.0.0' }})
          body: |
            ## 🚀 Deathless Downloader Android APK
            - **Build Type**: Android Debug APK
            - **Commit**: `${{ github.sha }}`
            - **Platform**: Capacitor 8 / Android SDK 36
            
            ### 📲 How to Install:
            1. Download the `Deathless-Downloader-debug.apk` file attached below.
            2. On your Android phone, tap the file to install.
            3. If prompted, enable "Allow installation from unknown sources".
          draft: false
          prerelease: false
          files: |
            output/Deathless-Downloader-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
