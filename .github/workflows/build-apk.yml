name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Generate Production APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js & Build Web UI
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web & Sync Android
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: Fix Executable Permissions
        run: chmod +x gradlew
        working-directory: android

      - name: Compile Kotlin and Assemble APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Export Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deathless-Downloader-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
